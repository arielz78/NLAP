name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  editor-console:
    name: Editor console (test, lint, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/editor-console
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/editor-console/package-lock.json

      - name: Install
        run: npm ci

      # Plain `npm test` (vitest run). The extra JSON reporter only feeds the
      # report step below; it does not change which tests run or the exit code.
      # No database exists in CI, so R8_REQUIRE_INTEGRATION_DB is deliberately
      # unset and the PostgreSQL suite skips itself (describe.skipIf).
      - name: Test
        run: npm test -- --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/vitest-report.json"

      - name: Report database tests (skipped is not passed)
        if: ${{ !cancelled() }}
        run: |
          node <<'EOF'
          const fs = require("node:fs");
          const path = require("node:path");

          const reportPath = path.join(process.env.RUNNER_TEMP, "vitest-report.json");
          const out = [];
          const annotate = (level, title, message) =>
            console.log(`::${level} title=${title}::${message}`);

          if (!fs.existsSync(reportPath)) {
            annotate("warning", "Database tests: status unknown",
              "vitest produced no JSON report, so the database tests cannot be classified. They are NOT known to have passed.");
            out.push("### Editor console tests", "", "No vitest report was produced. Database tests: **status unknown, not passed**.");
          } else {
            const report = JSON.parse(fs.readFileSync(reportPath, "utf8"));
            const tally = () => ({ passed: 0, failed: 0, skipped: 0 });
            const unit = tally();
            const db = tally();
            let dbFiles = 0;
            for (const file of report.testResults) {
              const isDb = /\.integration\.test\.[cm]?[jt]sx?$/.test(file.name);
              if (isDb) dbFiles += 1;
              for (const assertion of file.assertionResults) {
                const bucket = isDb ? db : unit;
                if (assertion.status === "passed") bucket.passed += 1;
                else if (assertion.status === "failed") bucket.failed += 1;
                else bucket.skipped += 1; // skipped | pending | todo
              }
            }

            let dbVerdict;
            if (dbFiles === 0) {
              dbVerdict = "NOT FOUND (no *.integration.test.* file in the report; not run, not passed)";
              annotate("warning", "Database tests NOT FOUND",
                "No *.integration.test.* file appeared in the vitest report. The database tests did not run and are not counted as passed.");
            } else if (db.skipped > 0) {
              dbVerdict = `SKIPPED (${db.skipped} not run; CI has no database)`;
              annotate("notice", "Database tests SKIPPED",
                `${db.skipped} PostgreSQL integration test(s) were SKIPPED, not run and not passed (CI has no database). ${db.passed} ran and passed, ${db.failed} failed.`);
            } else {
              dbVerdict = `RAN (${db.passed} passed, ${db.failed} failed)`;
            }

            out.push(
              "### Editor console tests",
              "",
              "| Suite | Passed | Failed | Skipped (not run) |",
              "| --- | ---: | ---: | ---: |",
              `| Unit | ${unit.passed} | ${unit.failed} | ${unit.skipped} |`,
              `| Database (PostgreSQL integration) | ${db.passed} | ${db.failed} | ${db.skipped} |`,
              "",
              `**Database tests: ${dbVerdict}.** A skipped test is not a passed test.`,
            );
          }

          console.log(out.join("\n"));
          if (process.env.GITHUB_STEP_SUMMARY) {
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, out.join("\n") + "\n");
          }
          EOF

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # The PostgreSQL suite needs real Neon: the console talks to its database only through
  # @neondatabase/serverless (HTTP and WebSocket), which a plain postgres container does not serve.
  # Each run branches off NEON_CI_PARENT_BRANCH, an EMPTY branch made once by hand, so CI never
  # holds the editor's data and every migration is applied from scratch. Not a schema-only branch
  # of production: that copies the tables but not editor_console_schema_migrations' rows, so
  # migration 0001 would be re-applied onto existing tables and fail.
  # Setup: secret NEON_API_KEY (project-scoped key); variables NEON_PROJECT_ID, NEON_CI_PARENT_BRANCH,
  # and NEON_DATABASE / NEON_ROLE if they differ from neondb / neondb_owner.
  editor-console-db:
    name: Editor console (PostgreSQL suite on a throwaway Neon branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Fork PRs get no secrets; they cannot create a branch.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    defaults:
      run:
        working-directory: apps/editor-console
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/editor-console/package-lock.json

      - name: Check Neon setup
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          NEON_CI_PARENT_BRANCH: ${{ vars.NEON_CI_PARENT_BRANCH }}
        run: |
          missing=""
          [ -n "$NEON_API_KEY" ] || missing="$missing secret:NEON_API_KEY"
          [ -n "$NEON_PROJECT_ID" ] || missing="$missing variable:NEON_PROJECT_ID"
          [ -n "$NEON_CI_PARENT_BRANCH" ] || missing="$missing variable:NEON_CI_PARENT_BRANCH"
          if [ -n "$missing" ]; then
            echo "::error title=Database tests not run::Missing$missing. The PostgreSQL suite did NOT run."
            exit 1
          fi
          echo "EXPIRES_AT=$(date -u -d '+1 hour' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Install
        run: npm ci

      - name: Create throwaway Neon branch
        id: neon
        uses: neondatabase/create-branch-action@fb620d43d4c565abaf088b848a4e28e5c4ea4d9c # 6.3.1
        with:
          api_key: ${{ secrets.NEON_API_KEY }}
          project_id: ${{ vars.NEON_PROJECT_ID }}
          parent_branch: ${{ vars.NEON_CI_PARENT_BRANCH }}
          branch_name: ci-${{ github.run_id }}-${{ github.run_attempt }}
          database: ${{ vars.NEON_DATABASE || 'neondb' }}
          role: ${{ vars.NEON_ROLE || 'neondb_owner' }}
          expires_at: ${{ env.EXPIRES_AT }}

      - name: PostgreSQL suite
        env:
          TEST_DATABASE_URL: ${{ steps.neon.outputs.db_url }}
          TEST_DATABASE_CONFIRMED_ISOLATED: "yes"
        # 30s, not vitest's 5s default: the first test applies every migration to a cold, empty branch.
        run: npm run test:integration -- --testTimeout=30000

      # Runs even when the tests fail; the branch's expiry is the backstop if this step never runs.
      - name: Delete throwaway Neon branch
        if: ${{ always() && steps.neon.outputs.branch_id != '' }}
        uses: neondatabase/delete-branch-action@4468d825d5a88ef4012f1705a82f02ec3072f776 # v3.2.1
        with:
          api_key: ${{ secrets.NEON_API_KEY }}
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: ${{ steps.neon.outputs.branch_id }}

  pipeline-scripts:
    name: Pipeline scripts (allocator, producer, writer, week chain, comparison, bundle tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/editor-console/package-lock.json

      # connectAirtable.js requires dotenv at load, so root deps are needed.
      # The test stubs fetch and sets fake credentials: no secrets, no env file.
      - name: Install
        run: npm ci

      - name: Test connectAirtable
        run: node --test scripts/connectAirtable.test.js

      # Includes the venue-match cases shared with the console (scripts/venue_match_cases.json).
      - name: Test allocator
        run: node scripts/buildIssues.js

      # Fixtures only: no database, no Airtable request.
      - name: Test submission bridge
        run: node --test scripts/applySubmission.test.js

      # Offline: no model call, no page fetch. The editor-feedback templates are
      # gitignored, so here the template checks run against the *.example copies.
      - name: Test issue producer
        run: node scripts/issue-build/issueBuild.test.js

      # Stubbed fetch, a temp folder under data/tracking: no Airtable request leaves the runner.
      - name: Test writeIssuePicks
        run: node --test scripts/writeIssuePicks.test.js

      # Stubbed model: no OpenAI or Airtable request leaves the runner.
      - name: Test generateBlurbs
        run: node --test scripts/generateBlurbs.test.js

      # Stubbed stages: no snapshot, no embedding call, no model call.
      - name: Test week chain
        run: node scripts/issue-build/runWeek.test.js

      - name: Test weekly comparison
        run: node --test scripts/weeklyComparison.test.js

      # The check against the console's TypeScript contract skips itself here: this job
      # does not install apps/editor-console. A skipped check is not a passed check.
      - name: Test bundle converter
        run: node --test scripts/issue-build/to-bundle.test.js
