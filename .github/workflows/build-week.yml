name: Build week
run-name: Build ${{ inputs.issue_date }}

# Stage B item 15/17: the console's "Build this week" button starts this. It runs item 4a's command
# (runWeek: snapshot -> R1 freshness -> history -> R7 -> prepare -> call -> finalize) on a runner, turns the
# run folder into a console bundle, publishes it to the console's database, and saves every file the run
# made back to the private repo NLAP-data, so a rerun resumes and the paid calls are never repeated.
#
# R1 runs first in the n8n container (run_r1, default on): it WRITES LIVE AIRTABLE Candidates, as a laptop
# run does. It never signs off a slate.
# The repo is public, so this log is public: the run's own output goes to a file and only the stage
# summary is printed. Run outputs are saved to the private repo, never uploaded as public artifacts.
on:
  workflow_dispatch:
    inputs:
      issue_date:
        description: Issue date (YYYY-MM-DD, a Thursday)
        required: true
      publish:
        description: Publish the build to the console
        type: boolean
        default: true
      run_r1:
        description: Run R1 (n8n) first. WRITES LIVE AIRTABLE Candidates, as a laptop run does.
        type: boolean
        default: true

concurrency:
  group: build-week
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      ISSUE: ${{ inputs.issue_date }}
      N8N_IMAGE: docker.n8n.io/n8nio/n8n:2.45.5
      WORKFLOW_ID: 7HsVm0pPg19CJX2k
    steps:
      - name: Check the issue date
        run: |
          set -euo pipefail
          [[ "$ISSUE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "Not a date: $ISSUE"; exit 1; }
          [ "$(date -d "$ISSUE" +%u)" = 4 ] || { echo "$ISSUE is not a Thursday"; exit 1; }

      - uses: actions/checkout@v4

      # ---- R1 in n8n, as proven by r1-host-test.yml on 2026-11-16. Its output holds event rows
      # (Facebook intake included), so it stays in a file and only the exit code is printed.
      - name: R1 — prepare the workflow and the credential
        if: inputs.run_r1
        env:
          AIRTABLE_PAT: ${{ secrets.AIRTABLE_PAT }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r1in" "$RUNNER_TEMP/r1out"
          # Eventbrite's browse page answers a datacenter IP with a captcha (Decision_Log §115).
          sed 's#"url": "https://www.eventbrite.com/d/canada--york/events/"#"url": "https://www.eventbrite.com/"#' \
            "workflows/NLAP R1.json" > "$RUNNER_TEMP/r1in/R1.json"
          if cmp -s "workflows/NLAP R1.json" "$RUNNER_TEMP/r1in/R1.json"; then
            echo "The Eventbrite token URL was not found in the workflow file"; exit 1
          fi
          jq -n --arg token "$AIRTABLE_PAT" '[{
            id: "M4nWbeUFeR35flxq",
            name: "Airtable Personal Access Token account 3",
            type: "airtableTokenApi",
            data: { accessToken: $token }
          }]' > "$RUNNER_TEMP/r1in/creds.json"
          docker volume create n8n_data > /dev/null
          docker pull -q "$N8N_IMAGE"
          n8n() { docker run --rm -v n8n_data:/home/node/.n8n -v "$RUNNER_TEMP/r1in:/in:ro" "$N8N_IMAGE" "$@"; }
          n8n import:credentials --input=/in/creds.json > "$RUNNER_TEMP/r1out/import.log" 2>&1 \
            || { echo "credential import failed"; grep -vE '^\s|^[][{}"]' "$RUNNER_TEMP/r1out/import.log" | cut -c1-200 | tail -20; exit 1; }
          rm -f "$RUNNER_TEMP/r1in/creds.json"
          n8n import:workflow --input=/in/R1.json > "$RUNNER_TEMP/r1out/import.log" 2>&1 \
            || { echo "workflow import failed"; grep -vE '^\s|^[][{}"]' "$RUNNER_TEMP/r1out/import.log" | cut -c1-200 | tail -20; exit 1; }

      - name: R1 — run
        if: inputs.run_r1
        run: |
          set -uo pipefail
          chmod 777 "$RUNNER_TEMP/r1out"
          # Written to a file inside the container: through docker's pipe n8n's output was cut off at exit.
          docker run --rm -v n8n_data:/home/node/.n8n -v "$RUNNER_TEMP/r1out:/out" \
            -e NODE_FUNCTION_ALLOW_BUILTIN=fs,https \
            -e GENERIC_TIMEZONE=America/Toronto -e TZ=America/Toronto \
            --entrypoint sh "$N8N_IMAGE" \
            -c "n8n execute --id $WORKFLOW_ID --rawOutput > /out/run.json 2> /out/run.err"
          code=$?
          echo "R1 exit $code, output $(wc -c < "$RUNNER_TEMP/r1out/run.json") bytes"
          [ $code -eq 0 ] || grep -hvE '^\s|^[][{}"]' "$RUNNER_TEMP/r1out/run.json" "$RUNNER_TEMP/r1out/run.err" | cut -c1-200 | tail -30
          echo "R1 exit $code" >> "$GITHUB_STEP_SUMMARY"
          rm -rf "$RUNNER_TEMP/r1in" "$RUNNER_TEMP/r1out"
          exit $code

      - name: Check out the private data repo
        uses: actions/checkout@v4
        with:
          repository: arielz78/NLAP-data
          token: ${{ secrets.NLAP_DATA_TOKEN }}
          path: _data

      - name: Lay the private files over the code
        run: rsync -a --exclude .git --exclude README.md --exclude .gitattributes _data/ ./

      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Python environment where runWeek looks for it
        run: |
          set -euo pipefail
          python -m venv models/.venv
          models/.venv/bin/pip install -q -r models/requirements.txt voyageai==0.5.0 python-dotenv==1.2.2

      - name: Run the week
        id: week
        env:
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_PAT }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          BEEHIIV_API_KEY: ${{ secrets.BEEHIIV_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
        run: |
          set -uo pipefail
          node scripts/issue-build/runWeek.js --issue "$ISSUE" > "$RUNNER_TEMP/runweek.log" 2>&1; code=$?
          # Stage summary, stop reasons and counts only, all written by runWeek or the producer itself.
          # Automatic-repair lines ("!!") name events, so only their count is printed (event rows stay out of
          # this public log, as in r1-host-test.yml); read them in the run folder in NLAP-data.
          summary() {
            grep -E '^Stage [a-z0-9-]+ (failed|stopped): |^(Page text by method|Warning): ' "$RUNNER_TEMP/runweek.log" | cut -c1-400 || true
            sed -n '/^Week build for/,$p' "$RUNNER_TEMP/runweek.log" | grep -v '^  !! ' | cut -c1-300 || true
            echo "runWeek exit $code"
          }
          summary
          { echo "### Week build for $ISSUE"; echo '```'; summary; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          run_dir=$(ls -d data/tracking/issue_build/*_"$ISSUE"_snapshot_* 2>/dev/null | while read -r d; do
            [ -f "$d/run_manifest.json" ] && echo "$d"; done | tail -1)
          echo "run_dir=$run_dir" >> "$GITHUB_OUTPUT"
          rm -f "$RUNNER_TEMP/runweek.log"
          exit $code

      - name: Make the console bundle
        if: steps.week.outcome == 'success'
        run: node scripts/issue-build/to-bundle.js "${{ steps.week.outputs.run_dir }}"

      - name: Publish to the console
        if: steps.week.outcome == 'success' && inputs.publish
        working-directory: apps/editor-console
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          npm ci
          npm run publish-build -- "$GITHUB_WORKSPACE/${{ steps.week.outputs.run_dir }}/bundle.json" --apply

      # Runs even when a stage failed: the snapshot, R7 scores and any paid response must survive the runner.
      - name: Save the run's files to NLAP-data
        if: always()
        run: |
          set -euo pipefail
          for p in data/tracking/snapshots data/tracking/r7_live_runner data/tracking/issue_build data/beehiiv/issue_history.json; do
            [ -e "$p" ] || continue
            if [ -d "$p" ]; then mkdir -p "_data/$p"; rsync -a "$p/" "_data/$p/"; else mkdir -p "_data/$(dirname "$p")"; cp "$p" "_data/$p"; fi
          done
          cd _data
          git config user.name "nlap-build"
          git config user.email "nlap-build@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nothing new to save."; exit 0; fi
          git commit -q -m "Week build $ISSUE (run ${{ github.run_id }})"
          # The laptop may have pushed meanwhile; a rejected push would lose this run's paid outputs.
          git pull --rebase -q
          git push -q
          echo "Saved $(git show --stat --format= HEAD | tail -1)"
